                  <p>怎么把东西做得更慢一点、更少一点。</p>
                </div>
              </div>
            </section>
          </BaseLayout>

          <style>
            .now-list { display: grid; gap: 36px; max-width: 560px; }
            .now-item h2 { margin: 0 0 8px; font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: .04em; color: var(--ink); }
            .now-item p { margin: 0; font-size: 15px; line-height: 1.9; color: var(--ink-soft); }
          </style>
          EOF

          cat > src/pages/rss.xml.js << 'EOF'
          import rss from '@astrojs/rss';
          import { getCollection } from 'astro:content';

          export async function GET(context) {
            const posts = (await getCollection('posts')).sort((a, b) => b.data.date.valueOf() - a.data.date.valueOf());
            return rss({
              title: '宫水',
              description: '一处在水边慢慢写的地方。',
              site: context.site ?? 'https://gongshui.com',
              items: posts.map((post) => ({
                title: post.data.title,
                pubDate: post.data.date,
                description: post.data.description,
                link: `/notes/${post.id}/`,
              })),
            });
          }
          EOF

          cat > src/content/posts/why-water.md << 'EOF'
          ---
          title: 为什么是水
          description: 给这个站点一个开场，也给自己一个慢慢写的理由。
          date: 2026-10-20
          ---
          「宫水」这两个字，最初只是个名字。
          后来想，既然域名都买了，不如让它有点意思。水是个很好的借口：它慢，它有耐心，它不争，它总能找到绕过去的路。
          这个站点大概会是这样：
          - 不追热点，不保证更新频率
          - 写一些关于水、日常、阅读和手艺的短东西
          - 偶尔放一点做过的项目
          如果你也在水边坐过，欢迎写信。
          EOF

          cat > src/content/posts/slow.md << 'EOF'
          ---
          title: 慢一点也没关系
          description: 关于更新频率、完美主义，和先上线再说。
          date: 2026-10-18
          ---
          做个人网站最大的敌人不是技术，是「等我想清楚」。
          我的经验是：先上线一个很丑但能打开的版本，比在本地改一百遍强。
          水不会等河道修好才流。
          EOF

