<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 氛围感场景</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 20px;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>
    <div id="loading">正在构建 3D 场景...</div>

    <!-- 引入 Three.js 和 后期处理库 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

        // 配置区：将这里的 URL 替换为你本地图片的路径，例如 'bg.jpg'
        // 如果你是直接在网页上截的图，也可以填入图片的网络链接
        const IMAGE_URL = 'bg.jpg'; 

        let camera, scene, renderer, composer;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        init();
        animate();

        function init() {
            // 1. 场景与相机
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.05); // 添加一点空间雾效

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5; // 相机初始位置

            // 2. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 3. 加载主画面（将2D图像作为3D平面映射）
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(IMAGE_URL, (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;
                
                // 自动计算图片比例
                const aspect = texture.image.width / texture.image.height;
                // 确保图片铺满屏幕
                let planeWidth = 10;
                let planeHeight = 10;
                if (aspect > window.innerWidth / window.innerHeight) {
                    planeWidth = planeHeight * aspect;
                } else {
                    planeHeight = planeWidth / aspect;
                }

                const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
                const material = new THREE.MeshBasicMaterial({ map: texture });
                const plane = new THREE.Mesh(geometry, material);
                
                // 稍微向后推一点，给前景光斑留出空间
                plane.position.z = -2; 
                scene.add(plane);

                document.getElementById('loading').style.opacity = 0;
            }, undefined, (err) => {
                console.error("图片加载失败，请检查文件路径", err);
                document.getElementById('loading').innerText = "图片加载失败，请确保 bg.jpg 和 index.html 在同一目录下";
            });

            // 4. 创建 3D 光斑粒子（模拟景深和灰尘）
            createBokehParticles();

            // 5. 创建 3D 阳光光晕
            createSunGlow();

            // 6. 后期处理（极其关键的画质提升）
            const renderScene = new RenderPass(scene, camera);
            
            // 泛光效果（让阳光更刺眼）
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5, 0.4, 0.85
            );

            // 景深效果（焦外虚化）
            const bokehPass = new BokehPass(scene, camera, {
                focus: 5.0,     // 焦距
                aperture: 0.015, // 光圈大小
                maxblur: 0.02    // 最大模糊程度
            });

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
            composer.addPass(bokehPass);

            // 事件监听
            document.addEventListener('mousemove', onDocumentMouseMove);
            window.addEventListener('resize', onWindowResize);
        }

        function createBokehParticles() {
            const particleCount = 150;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                // 将粒子分布在相机前方和后方
                positions[i * 3] = (Math.random() - 0.5) * 20;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 15;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 10; // 深度

                // 赋予暖色调光芒（模拟阳光光斑）
                const color = new THREE.Color().setHSL(0.1, 0.8, 0.8);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // 创建圆形发光纹理
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,220,150,0.8)');
            gradient.addColorStop(1, 'rgba(255,200,100,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 64);
            
            const particleTexture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.5,
                map: particleTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
            
            // 保存引用以便动画中操作
            scene.userData.particles = particles;
        }

        function createSunGlow() {
            // 在右上方模拟一个强光源（太阳/高光）
            const geometry = new THREE.PlaneGeometry(15, 15);
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(128, 128, 0, 128, 128, 128);
            gradient.addColorStop(0, 'rgba(255, 250, 230, 1)');
            gradient.addColorStop(0.1, 'rgba(255, 220, 150, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 256, 256);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true, 
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0.6
            });
            
            const glow = new THREE.Mesh(geometry, material);
            // 位置调整到画面的右上角（逆光位置）
            glow.position.set(3, 2, -4);
            scene.add(glow);
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) / 100;
            mouseY = (event.clientY - windowHalfY) / 100;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 平滑鼠标跟随
            targetX = mouseX * 0.5;
            targetY = mouseY * 0.5;

            // 相机产生轻微的 3D 视差移动
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (-targetY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            // 粒子缓慢漂浮
            if (scene.userData.particles) {
                const time = Date.now() * 0.0005;
                scene.userData.particles.rotation.y = time * 0.1;
                scene.userData.particles.position.y = Math.sin(time) * 0.2;
            }

            composer.render();
        }
    </script>
</body>
</html>
