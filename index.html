<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页脚</title>
<style>
  :root {
    --bg: #121212;
    --bg-input: #1a1a1a;
    --border: #262626;
    --text-primary: #e8e8e8;
    --text-secondary: #a3a3a3;
    --text-muted: #737373;
    --focus: #6b8aa8;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }

  /* 演示内容，可删 */
  .demo {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 80px 24px;
    text-align: center;
  }
  .demo h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
  .demo p  { margin: 0; color: #737373; font-size: 14px; }

  /* ===== 页脚 ===== */
  .site-footer {
    margin-top: auto;
    background: var(--bg);
    color: var(--text-secondary);
  }

  .footer-container {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .footer-main {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 64px;
    padding: 48px 0 40px;
  }

  /* 品牌区 */
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .2px;
    color: var(--text-primary);
    text-decoration: none;
  }
  .logo-mark {
    width: 8px;
    height: 8px;
    background: var(--text-primary);
    display: inline-block;
  }
  .footer-brand p {
    max-width: 220px;
    margin: 14px 0 0;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-muted);
  }

  .socials {
    display: flex;
    gap: 14px;
    margin-top: 20px;
  }
  .socials a {
    color: var(--text-muted);
    transition: color .15s;
  }
  .socials a:hover { color: var(--text-primary); }
  .socials svg { display: block; width: 16px; height: 16px; }

  /* 链接列 */
  .footer-nav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
  }
  .nav-col h4 {
    margin: 0 0 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .nav-col ul {
    display: grid;
    gap: 10px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .nav-col a {
    font-size: 13px;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color .15s;
  }
  .nav-col a:hover { color: var(--text-primary); }

  /* 底栏 */
  .footer-bottom {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 0 28px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }

  .footer-legal {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
  }
  .footer-legal a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color .15s;
  }
  .footer-legal a:hover { color: var(--text-primary); }

  /* 订阅 */
  .subscribe {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .subscribe input {
    width: 200px;
    padding: 8px 10px;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border-color .15s;
  }
  .subscribe input::placeholder { color: var(--text-muted); }
  .subscribe input:focus { border-color: var(--focus); }

  .subscribe button {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--bg);
    background: var(--text-primary);
    border: 1px solid var(--text-primary);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .subscribe button:hover { background: #fff; border-color: #fff; }
  .subscribe button:disabled { opacity: .6; cursor: default; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    .footer-main {
      grid-template-columns: 1fr;
      gap: 40px;
      padding: 40px 0 32px;
    }
  }
  @media (max-width: 640px) {
    .footer-nav { grid-template-columns: repeat(2, 1fr); gap: 28px 20px; }
    .footer-bottom { flex-direction: column; align-items: flex-start; }
    .subscribe { width: 100%; }
    .subscribe input { flex: 1; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <main class="demo">
    <h1>页面内容</h1>
    <p>向下滚动查看页脚</p>
  </main>

  <footer class="site-footer">
    <div class="footer-container">

      <div class="footer-main">
        <div class="footer-brand">
          <a href="#" class="logo">
            <span class="logo-mark" aria-hidden="true"></span>
            Nova Studio
          </a>
          <p>简洁、务实的数字产品工作室。</p>
          <div class="socials">
            <a href="#" aria-label="GitHub">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.26 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
            </a>
            <a href="#" aria-label="X">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.68l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23Zm-1.16 17.52h1.83L7.08 4.13H5.12l11.96 15.64Z"/></svg>
            </a>
            <a href="mailto:hello@example.com" aria-label="邮件">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>
            </a>
          </div>
        </div>

        <nav class="footer-nav" aria-label="页脚导航">
          <div class="nav-col">
            <h4>产品</h4>
            <ul>
              <li><a href="#">功能</a></li>
              <li><a href="#">定价</a></li>
              <li><a href="#">更新日志</a></li>
              <li><a href="#">路线图</a></li>
            </ul>
          </div>
          <div class="nav-col">
            <h4>公司</h4>
            <ul>
              <li><a href="#">关于</a></li>
              <li><a href="#">团队</a></li>
              <li><a href="#">招聘</a></li>
              <li><a href="#">联系</a></li>
            </ul>
          </div>
          <div class="nav-col">
            <h4>资源</h4>
            <ul>
              <li><a href="#">帮助中心</a></li>
              <li><a href="#">文档</a></li>
              <li><a href="#">博客</a></li>
              <li><a href="#">API</a></li>
            </ul>
          </div>
          <div class="nav-col">
            <h4>支持</h4>
            <ul>
              <li><a href="#">FAQ</a></li>
              <li><a href="#">系统状态</a></li>
              <li><a href="#">反馈</a></li>
              <li><a href="#">社区</a></li>
            </ul>
          </div>
        </nav>
      </div>

      <div class="footer-bottom">
        <div class="footer-legal">
          <span>© <span id="year">2025</span> Nova Studio</span>
          <a href="#">隐私政策</a>
          <a href="#">服务条款</a>
          <a href="#">Cookie</a>
        </div>
        <form class="subscribe" id="subscribeForm" novalidate>
          <input type="email" placeholder="邮箱地址" aria-label="邮箱地址" required>
          <button type="submit">订阅</button>
        </form>
      </div>

    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    var form = document.getElementById('subscribeForm');
    var input = form.querySelector('input');
    var button = form.querySelector('button');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (!v || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
        input.focus();
        input.setCustomValidity('请输入有效邮箱');
        input.reportValidity();
        input.setCustomValidity('');
        return;
      }
      var original = button.textContent;
      button.disabled = true;
      button.textContent = '已订阅';
      input.value = '';
      setTimeout(function () {
        button.disabled = false;
        button.textContent = original;
      }, 2000);
    });
  </script>

</body>
</html>
