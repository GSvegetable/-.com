<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛玻璃测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* 纯黑背景 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 页面上的灰色淡字 */
        .faint-text {
            position: absolute;
            color: rgba(255, 255, 255, 0.15); /* 极淡的灰色 */
            font-size: 1rem;
            letter-spacing: 2px;
        }

        /* 把字散落在屏幕各个位置 */
        .text-1 { top: 20%; left: 15%; }
        .text-2 { top: 30%; right: 20%; }
        .text-3 { bottom: 25%; left: 20%; }
        .text-4 { bottom: 15%; right: 15%; }
        .text-5 { top: 10%; left: 50%; transform: translateX(-50%); }

        /* 为了能让毛玻璃有效果，背后必须有个微弱的光斑/图形 */
        .glow-bg {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(80, 80, 80, 0.4) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 1;
        }

        /* 安卓风格的毛玻璃圆圈 */
        .android-glass-circle {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%; /* 圆形 */
            z-index: 2;
            
            /* 核心：毛玻璃效果 */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); /* 兼容苹果设备 */
            
            /* 安卓 Material 风格的质感：微微的底色 + 极其微弱的描边 */
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            
            /* 增加一点点内阴影让它有体积感 */
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- 散落的灰色淡字 -->
    <div class="faint-text text-1">宫水</div>
    <div class="faint-text text-2">Musubi</div>
    <div class="faint-text text-3">2026</div>
    <div class="faint-text text-4">Kuchikamizake</div>
    <div class="faint-text text-5">Itomori</div>

    <!-- 毛玻璃背后的微弱光斑（如果没有它，纯黑背景下的毛玻璃是看不见的） -->
    <div class="glow-bg"></div>

    <!-- 安卓质感毛玻璃圆圈 -->
    <div class="android-glass-circle"></div>

</body>
</html>
