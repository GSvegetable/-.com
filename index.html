<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宫水 - 组纽</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #fdfaf6; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfdfaf6); // 暖白背景
        scene.fog = new THREE.FogExp2(0xfdfaf6, 0.006);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        // 关闭抗锯齿以提升平板性能
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // 彻底关闭阴影，减轻GPU负担
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);

        // 极简光影
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
        keyLight.position.set(-15, 25, 20);
        scene.add(keyLight);

        const ropeGroup = new THREE.Group();
        scene.add(ropeGroup);

        // ========== 核心：32股四色编织结构 ==========
        const strands = 32;
        const strandRadius = 0.06;
        const braidRadius = 0.75;

        // 四色丝线材质
        const colors = [0xc41e3a, 0xd4691e, 0x2e5c8a, 0xf0ead6];
        const materials = colors.map(c => new THREE.MeshPhongMaterial({
            color: c,
            shininess: 80,      // 高光，模拟丝线光泽
            specular: 0x333333  // 反光颜色
        }));

        // 主轨迹
        const mainPoints = [
            new THREE.Vector3(50, 35, -30),
            new THREE.Vector3(30, 20, -5),
            new THREE.Vector3(8, 8, 15),
            new THREE.Vector3(-12, -2, 10),
            new THREE.Vector3(-22, -18, 0),
            new THREE.Vector3(-8, -30, -8),
            new THREE.Vector3(15, -28, -15),
            new THREE.Vector3(25, -15, -20)
        ];
        const mainCurve = new THREE.CatmullRomCurve3(mainPoints);

        // 生成32股编织线
        for (let i = 0; i < strands; i++) {
            const points = [];
            const segments = 200; // 从500降到200，大幅减少计算量

            for (let j = 0; j <= segments; j++) {
                const t = j / segments;
                const point = mainCurve.getPoint(t);
                const tangent = mainCurve.getTangent(t);

                const normal = new THREE.Vector3(0, 1, 0).cross(tangent).normalize();
                const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

                const groupIndex = Math.floor(i / 4);
                const strandInGroup = i % 4;
                const groupPhase = (groupIndex / 8) * Math.PI * 2;
                const twist = t * Math.PI * 2 * 120 + groupPhase + (strandInGroup * Math.PI / 2);

                const offset = new THREE.Vector3()
                    .addScaledVector(normal, Math.cos(twist) * braidRadius)
                    .addScaledVector(binormal, Math.sin(twist) * braidRadius);

                points.push(point.clone().add(offset));
            }

            const strandCurve = new THREE.CatmullRomCurve3(points);
            // radialSegments 从 5 降到 3（三角形截面，肉眼几乎看不出）
            const tubeGeo = new THREE.TubeGeometry(strandCurve, segments, strandRadius, 3, false);
            const mesh = new THREE.Mesh(tubeGeo, materials[i % 4]);
            ropeGroup.add(mesh);
        }

        // ========== 甩入动画 ==========
        let clock = new THREE.Clock();
        ropeGroup.position.set(60, 40, -40);
        ropeGroup.rotation.set(Math.PI/3, -Math.PI/2, Math.PI/6);
        ropeGroup.scale.set(0.85, 0.85, 0.85);

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            const duration = 3.5;
            const t = Math.min(time / duration, 1);
            const easeOut = 1 - Math.pow(1 - t, 3);

            ropeGroup.position.x = THREE.MathUtils.lerp(60, 0, easeOut);
            ropeGroup.position.y = THREE.MathUtils.lerp(40, 0, easeOut);
            ropeGroup.position.z = THREE.MathUtils.lerp(-40, 0, easeOut);

            ropeGroup.rotation.x = THREE.MathUtils.lerp(Math.PI/3, 0, easeOut);
            ropeGroup.rotation.y = THREE.MathUtils.lerp(-Math.PI/2, 0.15, easeOut);
            ropeGroup.rotation.z = THREE.MathUtils.lerp(Math.PI/6, 0, easeOut);

            if (t >= 1) {
                ropeGroup.rotation.y = 0.15 + Math.sin(time * 0.4) * 0.08;
                ropeGroup.rotation.z = Math.sin(time * 0.6) * 0.04;
                ropeGroup.position.y = Math.sin(time * 1.1) * 0.25;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
