<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宫水 - 结绳</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #fdfaf6; /* 偏暖的纯白 */ }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        // 设置背景为暖白色
        scene.background = new THREE.Color(0xfdfaf6); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // 开启阴影，让丝线更有立体感
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 灯光设置，为了照出丝线的光泽 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 20);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffaaaa, 1, 100);
        pointLight.position.set(-10, -10, 10);
        scene.add(pointLight);

        // --- 核心：生成编织结绳 ---
        const ropeGroup = new THREE.Group();
        scene.add(ropeGroup);

        // 我们生成3根线，让它们相互缠绕，形成编织感
        const strands = 3; 
        const strandRadius = 0.4; // 单根线的粗细
        const braidRadius = 1.5;  // 三根线缠绕形成的总宽度
        
        // 模拟红线的材质 (亮红色，带有丝线光泽)
        const redMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xcc1111,       // 深红色
            roughness: 0.3,        // 表面像丝线一样稍微有一点粗糙度
            metalness: 0.1,
            clearcoat: 0.5,        // 增加一层清漆感，更有光泽
            clearcoatRoughness: 0.2
        });

        // 构建三维空间中的主路径（被甩进来的轨迹）
        // 路径点：从右上角屏幕外，甩向左边，再绕回来
        const mainPoints = [
            new THREE.Vector3(30, 20, -10),  // 起点，屏幕外
            new THREE.Vector3(10, 10, 0),
            new THREE.Vector3(-5, 5, 5),
            new THREE.Vector3(-15, -10, 0),
            new THREE.Vector3(0, -20, -5),
            new THREE.Vector3(15, -10, 5),
            new THREE.Vector3(5, 10, 10)
        ];
        const mainCurve = new THREE.CatmullRomCurve3(mainPoints);

        // 生成编织线
        for (let i = 0; i < strands; i++) {
            const points = [];
            const segments = 200; // 路径精细度
            
            for (let j = 0; j <= segments; j++) {
                const t = j / segments;
                
                // 获取主路径上的当前点
                const point = mainCurve.getPoint(t);
                const tangent = mainCurve.getTangent(t);
                
                // 获取法线和副法线（用于围绕主轴旋转）
                const normal = new THREE.Vector3(0, 1, 0).cross(tangent).normalize();
                const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

                // 编织的数学逻辑：随着 t 的增加，角度不断旋转
                // 3根线，每根线相差 2PI / 3 的相位
                const phaseOffset = (i / strands) * Math.PI * 2;
                const twistAmount = 60; // 缠绕的圈数
                const angle = t * Math.PI * 2 * twistAmount + phaseOffset;

                // 计算偏移量
                const offset = new THREE.Vector3()
                    .addScaledVector(normal, Math.cos(angle) * braidRadius)
                    .addScaledVector(binormal, Math.sin(angle) * braidRadius);

                // 最终位置 = 主路径点 + 缠绕偏移
                points.push(point.clone().add(offset));
            }

            const strandCurve = new THREE.CatmullRomCurve3(points);
            // 用 TubeGeometry 沿着曲线生成管子
            const tubeGeo = new THREE.TubeGeometry(strandCurve, 400, strandRadius, 8, false);
            const mesh = new THREE.Mesh(tubeGeo, redMaterial);
            ropeGroup.add(mesh);
        }

        // --- 动画部分 ---
        let clock = new THREE.Clock();
        
        // 初始位置在屏幕外很远的地方
        ropeGroup.position.set(50, 50, -50);
        ropeGroup.rotation.set(Math.PI/4, -Math.PI/4, 0);

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 1. 利用缓动函数让它在2秒内“甩”进来
            const t = Math.min(time / 2, 1); 
            // 缓出效果 (easeOutCubic)
            const easeOut = 1 - Math.pow(1 - t, 3); 

            // 从屏幕外甩入中心位置 (0,0,0)
            ropeGroup.position.x = THREE.MathUtils.lerp(50, 0, easeOut);
            ropeGroup.position.y = THREE.MathUtils.lerp(50, 0, easeOut);
            ropeGroup.position.z = THREE.MathUtils.lerp(-50, 0, easeOut);

            // 甩进来的同时，解开旋转
            ropeGroup.rotation.x = THREE.MathUtils.lerp(Math.PI/4, 0, easeOut);
            ropeGroup.rotation.y = THREE.MathUtils.lerp(-Math.PI/4, 0, easeOut);

            // 2. 进入屏幕后，像水一样缓慢飘动
            if (t >= 1) {
                ropeGroup.rotation.y += 0.002;
                ropeGroup.rotation.z = Math.sin(time * 0.5) * 0.1;
                ropeGroup.position.y = Math.sin(time * 1) * 0.5;
            }

            renderer.render(scene, camera);
        }
        animate();

        // 窗口适配
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
