<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宫水 - 组纽</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #fdfaf6; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfdfaf6);
        scene.fog = new THREE.FogExp2(0xfdfaf6, 0.008); // 增加雾效，让线条有纵深感

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔和阴影
        document.body.appendChild(renderer.domElement);

        // --- 电影级光影：模拟从左上角打下的窗光 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.2); // 暖色主光
        mainLight.position.set(-20, 30, 20);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4); // 冷色补光
        fillLight.position.set(20, -10, -10);
        scene.add(fillLight);

        // --- 核心：编织组纽 ---
        const ropeGroup = new THREE.Group();
        scene.add(ropeGroup);

        // 电影设定：8根细线编织[reference:4]
        const strands = 8; 
        const strandRadius = 0.12; // 极细的线
        const braidRadius = 0.8;   // 紧密的编织结构

        // 材质：带有丝质光泽的朱红色[reference:5]
        const silkMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xc41e3a,       // 朱红 / 茜色
            roughness: 0.4,        // 丝线微小的粗糙感
            metalness: 0.0,
            clearcoat: 0.6,        // 丝质反光
            clearcoatRoughness: 0.3,
            sheen: 1.0,            // 丝绸特有的光泽
            sheenColor: new THREE.Color(0xff8888),
            sheenRoughness: 0.5
        });

        // 构建一条优雅的 S 型轨迹，模拟在空中舒展的姿态
        const mainPoints = [
            new THREE.Vector3(40, 30, -20),   // 从画面外右上角进入
            new THREE.Vector3(25, 20, -5),
            new THREE.Vector3(5, 10, 10),     // 向中心舒展
            new THREE.Vector3(-10, -5, 5),    // 向下垂落
            new THREE.Vector3(-25, -20, -5),  // 甩向左下
            new THREE.Vector3(-15, -30, -15),
            new THREE.Vector3(10, -25, -20),  // 尾部收束
        ];
        const mainCurve = new THREE.CatmullRomCurve3(mainPoints);

        // 生成编织线
        for (let i = 0; i < strands; i++) {
            const points = [];
            const segments = 400; // 极高的细分，保证曲线极度平滑
            
            for (let j = 0; j <= segments; j++) {
                const t = j / segments;
                const point = mainCurve.getPoint(t);
                const tangent = mainCurve.getTangent(t);
                
                // 计算法线和副法线
                const normal = new THREE.Vector3(0, 1, 0).cross(tangent).normalize();
                const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

                // 8根线的相位偏移
                const phaseOffset = (i / strands) * Math.PI * 2;
                
                // 编织密度：随着 t 的变化，缠绕的松紧度也有微小变化，显得更自然
                const twistDensity = 80; 
                const angle = t * Math.PI * 2 * twistDensity + phaseOffset;

                // 在法线和副法线方向上施加偏移
                const offset = new THREE.Vector3()
                    .addScaledVector(normal, Math.cos(angle) * braidRadius)
                    .addScaledVector(binormal, Math.sin(angle) * braidRadius);

                points.push(point.clone().add(offset));
            }

            const strandCurve = new THREE.CatmullRomCurve3(points);
            // 极细的管子，配合高分段
            const tubeGeo = new THREE.TubeGeometry(strandCurve, 400, strandRadius, 6, false);
            const mesh = new THREE.Mesh(tubeGeo, silkMaterial);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            ropeGroup.add(mesh);
        }

        // --- 物理动画：模拟“甩”入的动量与惯性 ---
        let clock = new THREE.Clock();
        
        // 初始状态：整个绳组在屏幕外，并且极度扭曲
        ropeGroup.position.set(60, 40, -30);
        ropeGroup.rotation.set(Math.PI/2, -Math.PI/2, Math.PI/4);
        ropeGroup.scale.set(0.8, 0.8, 0.8);

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 1. 入场动画（前 3 秒）
            const duration = 3.0; 
            const t = Math.min(time / duration, 1); 
            
            // easeOutQuart：先快后慢，模拟甩出后的减速
            const easeOut = 1 - Math.pow(1 - t, 4); 
            // easeOutBounce：轻微的弹性效果，模拟丝线的韧性
            const bounce = Math.sin(t * Math.PI * 1.5) * 0.1 * (1 - t);

            // 位置：从右上角甩入中心
            ropeGroup.position.x = THREE.MathUtils.lerp(60, 0, easeOut);
            ropeGroup.position.y = THREE.MathUtils.lerp(40, 0, easeOut) + bounce;
            ropeGroup.position.z = THREE.MathUtils.lerp(-30, 0, easeOut);

            // 旋转：在甩入过程中逐渐“展开”
            ropeGroup.rotation.x = THREE.MathUtils.lerp(Math.PI/2, 0, easeOut);
            ropeGroup.rotation.y = THREE.MathUtils.lerp(-Math.PI/2, 0.2, easeOut);
            ropeGroup.rotation.z = THREE.MathUtils.lerp(Math.PI/4, 0, easeOut);

            // 2. 悬浮动画（入场后）
            if (t >= 1) {
                // 极其缓慢的呼吸感旋转
                ropeGroup.rotation.y = 0.2 + Math.sin(time * 0.3) * 0.1;
                ropeGroup.rotation.z = Math.sin(time * 0.5) * 0.05;
                // 像丝线一样在空中微微上下飘动
                ropeGroup.position.y = Math.sin(time * 1.2) * 0.3;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
