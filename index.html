<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宫水</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Microsoft YaHei', sans-serif; }
        canvas { display: block; }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff;
        }
        h1 {
            font-size: 6rem; letter-spacing: 1rem; margin: 0;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.8), 0 0 40px rgba(100, 200, 255, 0.4);
            animation: breathe 4s ease-in-out infinite alternate;
        }
        p {
            font-size: 1.2rem; letter-spacing: 0.5rem; margin-top: 20px;
            opacity: 0.7; color: #a0c0e0;
        }
        @keyframes breathe {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(100, 200, 255, 0.8); }
            100% { transform: scale(1.02); text-shadow: 0 0 40px rgba(200, 100, 255, 0.9); }
        }
    </style>
    <!-- 引入 Three.js 3D引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <h1>宫 水</h1>
        <p>黄昏之时，跨越时空的相遇</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.003);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 1. 星空粒子生成
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 3000;
        const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 200;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 });
        const starMesh = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starMesh);

        // 2. 自定义 GLSL 着色器水面
        const waterGeometry = new THREE.PlaneGeometry(200, 200, 128, 128);
        const waterMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(0x1a4d80) } // 深邃的湖蓝色
            },
            vertexShader: `
                uniform float uTime;
                varying float vElevation;
                void main() {
                    vec3 pos = position;
                    // 数学波浪公式
                    float elevation = sin(pos.x * 0.2 + uTime) * cos(pos.y * 0.2 + uTime) * 1.5;
                    pos.z += elevation;
                    vElevation = elevation;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vElevation;
                void main() {
                    // 根据波浪高度改变颜色（模拟反光）
                    vec3 color = uColor + vec3(vElevation * 0.1, vElevation * 0.15, vElevation * 0.2);
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            wireframe: true // 加上线框显得更有科技感
        });
        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.rotation.x = -Math.PI / 2;
        water.position.y = -5;
        scene.add(water);

        // 3. 流星/彗星系统
        const cometGeometry = new THREE.BufferGeometry();
        const cometCount = 100;
        const cometPositions = new Float32Array(cometCount * 3);
        for(let i=0; i<cometCount*3; i++) {
            cometPositions[i] = (Math.random() - 0.5) * 100;
            cometPositions[i+1] = (Math.random() * 50);
        }
        cometGeometry.setAttribute('position', new THREE.BufferAttribute(cometPositions, 3));
        const cometMaterial = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.5 });
        const comets = new THREE.Points(cometGeometry, cometMaterial);
        scene.add(comets);

        // 4. 动画循环
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // 更新着色器时间（让水动起来）
            waterMaterial.uniforms.uTime.value = elapsedTime;

            // 让星空和彗星慢慢旋转
            starMesh.rotation.y = elapsedTime * 0.02;
            comets.rotation.y = elapsedTime * 0.05;
            comets.position.y -= 0.1; // 彗星落下
            if(comets.position.y < -50) comets.position.y = 50;

            renderer.render(scene, camera);
        }
        animate();

        // 响应屏幕大小变化
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
